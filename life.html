<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>샬롬자유학교 - 학교생활</title>
  <link rel="stylesheet" href="/style.css" />
</head>
<body>
  <!-- 모든 페이지 위쪽에 같은 메뉴 -->
  <header class="site-header">
    <div class="header-inner">
      <a href="/" class="brand-link">
        <img src="/logo.jpg" alt="샬롬자유학교 로고" class="brand-logo" />
        <span>샬롬자유학교</span>
      </a>
      <nav aria-label="주요 메뉴">
        <ul class="nav-menu">
          <li><a href="/" class="nav-link">홈</a></li>
          <li><a href="/life" class="nav-link active">학교생활</a></li>
        </ul>
      </nav>
    </div>
  </header>

  <main class="main-container">
    <!-- 상단 안내 배너 -->
    <section class="hero-card">
      <div class="greeting-badge">👋 이왕이면 샬자~</div>
      <h1 class="hero-title">학교생활 안내</h1>
      <p class="hero-subtitle">신입생·전학생 친구들을 위한 하루와 공동체 일상 5가지</p>
    </section>

    <!-- 활동 카드 5개: 이름 · 한 줄 설명([ ] 빈칸) · 이모지 -->
    <section class="section-box">
      <div class="section-header">
        <span class="section-badge">활동 카드 5개</span>
        <h2 class="section-title">우리 학교의 일상과 공동체 활동</h2>
      </div>

      <div class="activity-grid">
        <!-- 카드 1: 아침묵상 -->
        <article class="activity-card">
          <div class="activity-top">
            <div class="activity-emoji" aria-hidden="true">🌅</div>
            <h3 class="activity-title">아침묵상</h3>
          </div>
          <p class="activity-desc">[ ]</p>
        </article>

        <!-- 카드 2: 기숙사 생활 -->
        <article class="activity-card">
          <div class="activity-top">
            <div class="activity-emoji" aria-hidden="true">🏠</div>
            <h3 class="activity-title">기숙사 생활</h3>
          </div>
          <p class="activity-desc">[ ]</p>
        </article>

        <!-- 카드 3: 비폭력대화 -->
        <article class="activity-card">
          <div class="activity-top">
            <div class="activity-emoji" aria-hidden="true">💬</div>
            <h3 class="activity-title">비폭력대화</h3>
          </div>
          <p class="activity-desc">[ ]</p>
        </article>

        <!-- 카드 4: 학교화폐·기본소득·콩앗이 -->
        <article class="activity-card">
          <div class="activity-top">
            <div class="activity-emoji" aria-hidden="true">🪙</div>
            <h3 class="activity-title">학교화폐·기본소득·콩앗이</h3>
          </div>
          <p class="activity-desc">[ ]</p>
        </article>

        <!-- 카드 5: 마을과 함께 -->
        <article class="activity-card">
          <div class="activity-top">
            <div class="activity-emoji" aria-hidden="true">🤝</div>
            <h3 class="activity-title">마을과 함께</h3>
          </div>
          <p class="activity-desc">[ ]</p>
        </article>
      </div>
    </section>
  </main>

  <!-- 맨 아래 필수 문구 -->
  <footer class="site-footer">
    학생 실습으로 만든 사이트예요 (공식 홈페이지 아님) · 공식 홈페이지: <a href="https://www.shalomfree.kr" target="_blank" rel="noopener noreferrer">shalomfree.kr</a>
  </footer>
</body>
</html>
